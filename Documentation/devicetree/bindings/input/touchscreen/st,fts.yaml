%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,fts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics FTM5 touchscreen controller

maintainers:
  - Abrikosi4 <116901278+Abrikosi4@users.noreply.github.com>

description:
  The STMicroelectronics FTM5 (FingerTip) is an I2C multitouch controller
  found e.g. on the Google Pixel 4a (sunfish).

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: st,fts

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Power supply / load-switch for the controller.

  reset-gpios:
    maxItems: 1

  st,switch-gpios:
    maxItems: 1
    description:
      GPIO muxing the controller's I2C bus between the application processor
      and the sensor low-power island (SLPI). Driven to select the AP.

  panel:
    description:
      Phandle of the DRM panel the controller senses for. When present, the
      driver enables sensing only while the panel is powered (panel-follower).
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@49 {
            compatible = "st,fts";
            reg = <0x49>;
            interrupt-parent = <&tlmm>;
            interrupts = <9 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 8 GPIO_ACTIVE_LOW>;
            st,switch-gpios = <&tlmm 72 GPIO_ACTIVE_HIGH>;
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2340>;
        };
    };
